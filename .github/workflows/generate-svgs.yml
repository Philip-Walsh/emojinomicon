name: Generate SVGs

on:
  push:
    branches:
      - master
    paths:
      - 'emoji.json'
      - 'src/**'
      - '.github/workflows/generate-svgs.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, '[generate-svgs]') }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate SVGs
        run: |
          python -m emojinomicon --emoji-data emoji.json --output-dir output

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Commit and push if changed
        run: |
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update generated SVGs [skip ci]" && git push) 